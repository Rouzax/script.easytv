# Structurally synced with script.easymovie/.github/workflows/validate.yml. Keep parallel.
name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Syntax check
        run: |
          find . -name "*.py" -not -path "*/__pycache__/*" -exec python3 -m py_compile {} \;

      - name: Ruff
        run: ruff check

      - name: Pyflakes
        run: |
          pyflakes $(find . -name "*.py" -not -path "*/__pycache__/*")

      - name: Clean __pycache__
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

      - name: Pyright
        run: pyright

      - name: Vulture
        run: vulture resources/lib --min-confidence 80

      # The checker downloads addons.xml.gz for every Kodi branch from
      # mirrors.kodi.tv. On a failed fetch, Repository.__init__ returns without
      # setting self.addons, so a later "addon in repo" test dies with
      # AttributeError instead of reporting a real finding. Retry so a mirror
      # blip cannot mask genuine problems. The step stays blocking.
      - name: Kodi addon checker
        run: |
          for attempt in 1 2 3; do
            kodi-addon-checker --branch omega . && exit 0
            echo "::warning::kodi-addon-checker attempt ${attempt} failed, retrying"
          done
          exit 1

      - name: Tests
        run: python3 -m pytest tests/ -v --cov=resources/lib --cov-report=term
